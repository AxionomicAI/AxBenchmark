<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Inventory</h1>
    <div class="header-actions">
      <button type="button" id="orders-btn" class="cart-btn">Orders</button>
      <button type="button" id="cart-btn" class="cart-btn">Cart (<span id="cart-count">0</span>)</button>
    </div>
  </header>
  <main id="app">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search SKU, name or category (press / to focus)" aria-label="Search products" autocomplete="off">
      <select id="category-filter" aria-label="Filter by category"></select>
      <label class="check"><input type="checkbox" id="low-filter"> Low stock only</label>
      <button type="button" id="add-btn" class="primary">Add product</button>
    </div>
    <p id="result-count" class="result-count" role="status"></p>
    <p id="message" class="message" role="status" hidden></p>
    <table id="table">
      <thead>
        <tr>
          <th>SKU</th><th>Name</th><th>Category</th>
          <th class="num">Price</th><th class="num">Qty</th><th class="num">Reorder at</th>
          <th><span class="sr-only">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden></p>
  </main>

  <dialog id="dialog">
    <form id="form" novalidate>
      <h2 id="dialog-title"></h2>
      <p id="form-error" class="error" role="alert" hidden></p>
      <label>SKU <input name="sku" required></label>
      <label>Name <input name="name" required></label>
      <label>Category <input name="category" list="categories"></label>
      <datalist id="categories"></datalist>
      <label>Price <input name="price" type="number" min="0" step="0.01" value="0"></label>
      <label>Quantity <input name="quantity" type="number" min="0" step="1" value="0"></label>
      <label>Reorder level <input name="reorderLevel" type="number" min="0" step="1" value="0"></label>
      <div class="actions">
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="cart-dialog" class="cart-dialog">
    <h2>Shopping cart</h2>
    <p id="cart-error" class="error" role="alert" hidden></p>
    <p id="cart-empty" class="empty">Your cart is empty.</p>
    <table id="cart-table">
      <thead>
        <tr><th>Product</th><th class="num">Price</th><th class="num">Quantity</th><th class="num">Subtotal</th><th><span class="sr-only">Actions</span></th></tr>
      </thead>
      <tbody id="cart-rows"></tbody>
      <tfoot>
        <tr><th colspan="3" class="num">Total</th><th class="num" id="cart-total"></th><th></th></tr>
      </tfoot>
    </table>
    <div class="actions">
      <button type="button" id="cart-clear" class="danger">Empty cart</button>
      <button type="button" id="cart-close">Close</button>
      <button type="button" id="checkout-btn" class="primary">Checkout</button>
    </div>
  </dialog>
  <dialog id="orders-dialog" class="cart-dialog">
    <h2>Order history</h2>
    <p id="orders-empty" class="empty">No orders yet.</p>
    <div id="orders-list"></div>
    <div class="actions">
      <button type="button" id="orders-close" class="primary">Close</button>
    </div>
  </dialog>
  <script src="js/storage.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
