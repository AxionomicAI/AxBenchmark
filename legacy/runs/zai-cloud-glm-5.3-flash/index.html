<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Inventory</h1>
    <p class="tagline">Track stock locally &mdash; your data never leaves this browser.</p>
  </header>

  <main id="app" class="container">
    <noscript>
      <p class="notice">This site requires JavaScript to manage inventory data.</p>
    </noscript>
    <section id="inventory-root">
      <!-- Inventory and cart UI are rendered by js/app.js -->
    </section>
  </main>

  <footer class="site-footer">
    <p>Inventory &middot; HTML5 + vanilla JavaScript &middot; data stored in localStorage</p>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
