# Application record: all original questions, assumptions, options, answers and notes
# below are preserved history. current_assumption and old suggestions are not policy.
# application.clauses links the current normative SPEC/module clauses; they take
# precedence over historical wording. applied means incorporated into specification
# and design contracts, not implemented or runtime-verified functionality.
# refined_by identifies follow-ups/confirmations in OPEN-QUESTIONS-R2.yaml and
# OPEN-QUESTIONS-R3.yaml; resolution records their final refinements or supersession.
# The original response instructions are retained below as historical context.
#
# Open questions left to the product owner by the module Implementation sections.
#
# How to answer: fill in `answer` for each item. Pick one of `options` by its key
# (e.g. `answer: b`), or write your own text. Add anything else under `notes`.
# Leave `answer` empty to keep the current assumption for now.

product_decisions:

  - id: P1
    modules: [M11, M14]
    question: Should `run --no-tui` exit 1 when a run completes but some tasks failed?
    current_assumption: Only stopped or interrupted runs exit 1.
    options:
      a: Keep it; completed runs exit 0 even with failed tasks.
      b: Exit 1 when any task failed or ended unverified.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/14-command-line-interface.md#unattended-execution-and-lifecycle"
      refined_by: [C1, R3-3]
      resolution: "Completed runs exit 0 despite failed or unverified tasks; later R3-3 adds default report waiting and --no-wait-report without making a failed report a failed run."

  - id: P2
    modules: [M09, M15]
    question: M09 wants `?` on the Library to open the inventory "about" screens, but `?` is the app-wide Help key. Which wins?
    current_assumption: Binding not added.
    options:
      a: "`?` stays Help; open the about screens with another key (say which in notes)."
      b: "`?` opens the about screens on the Library; Help moves to F1 there."
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/15-terminal-interface.md#4-screens"
        - "../modules/09-default-inventory-benchmark.md#4-screens"
      refined_by: [R2-7]
      resolution: "App-wide ? remains Help; R2-7 selects a for the built-in inventory About action."

  - id: P3
    modules: [M01, M02, M09]
    question: Should old README runs that match the default template only by name (no SHA-256) exist as "unlinked historical results"?
    current_assumption: M01 and M09 mention them; M02 has no such concept.
    options:
      a: No; historical runs stay in the repository and are not shown in the app.
      b: Yes; show them read-only, never in comparisons or rankings.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/01-template-library-identity.md#library-and-revision-operations"
      refined_by: [C5]
      resolution: "Historical README runs remain in the repository and are not shown in the app; association requires a verified SHA-256."

  - id: P4
    modules: [M04, M06, M07, M10]
    question: What proves a cost is a verified $0 for the ranking rule (R101)?
    current_assumption: Undecided.
    options:
      a: Only a local endpoint with no provider, recorded in the frozen launch.
      b: (a), or a reported $0 with complete usage coverage.
      c: Only an explicit user declaration recorded at launch.
    answer:   neither
    notes: cost is verified 0 when the api says so if is a local model and we could measure the power of the gpu we will display the kWh and we will ask the user the cost
    application:
      status: applied
      clauses:
        - "../modules/10-measurements-cost.md#cost-basis-and-currency"
        - "../modules/04-model-catalog.md#catalog-information-contract"
        - "../modules/06-scoring-rankings.md#eligibility-and-exceptional-data"
      refined_by: [R2-1, R2-2, R2-3, R3-1, R3-2, R3-5]
      resolution: "Later rounds refine the answer: verified zero requires reported zero, complete coverage and known non-subscription billing; recorded provider prices support API estimates, and measured local energy plus tariff can supply sequential-only cost estimates. Final clauses retain unverified numeric zero but exclude it from lowest-cost and positive-cost-weight rankings."

  - id: P5
    modules: [M03, M14]
    question: The CLI wireframe suggests `sudo axbenchmark doctor --collectors`, which under root would start a separate engine with root's state. What should happen?
    current_assumption: Undecided.
    options:
      a: Under root, doctor runs in-process and keeps no saved state.
      b: Drop the sudo suggestion; only show the permission fix.
    answer: b
    notes:
    application:
      status: applied
      clauses:
        - "../modules/03-environment-readiness.md#required-readiness-behavior"
        - "../modules/14-command-line-interface.md#purpose-and-command-contracts"
      resolution: "Doctor shows collector permission remedies without recommending an elevated AxBenchmark process or defining a root-mode engine."

  - id: P6
    modules: [M01, M16]
    question: Approving a duplicate or revision whose benchmark content did not change.
    current_assumption: The preview reports `existing_identity`; the approval outcome is undecided.
    options:
      a: Block approval and point to the existing revision.
      b: No-op; open the existing revision.
      c: Record lineage pointing at the existing SHA-256 without a new revision.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/01-template-library-identity.md#library-and-revision-operations"
        - "../modules/16-custom-template-planning.md#planner-selection-and-review"
      resolution: "Approval of identical defining content is blocked with an action to open the existing revision; display renaming remains separate from identity."

  - id: P7
    modules: [M07, M11]
    question: How should more than one trial per configuration behave?
    current_assumption: "`trials` is carried in the frozen launch with default 1."
    options:
      a: Allow only 1 for now; remove the field from the setup UI.
      b: Allow N; each trial is a separate result run in sequence (say how to aggregate in notes).
    answer: b
    notes:  have a way to display the results of each runs and have a an average of the results
    application:
      status: applied
      clauses:
        - "../modules/07-run-configuration.md#configuration-behavior"
        - "../modules/11-run-orchestration.md#scheduling-contract"
        - "../modules/12-quality-judging.md#review-inputs-and-execution"
        - "../modules/06-scoring-rankings.md#calculations"
      refined_by: [R2-4, R3-7]
      resolution: "R2-4 specifies fresh sequential trials, separate results and judge sessions, means/min-max and all-trial eligibility. R3-7 rejects the suggested upper limit; more than five trials warns when any competitor is non-local, with unattended execution printing the warning and continuing."

  - id: P8
    modules: [M11]
    question: With two runs active at the same time, do the "4 active / 1 per harness" limits apply per run or across the engine?
    current_assumption: Per run.
    options:
      a: Per run.
      b: Across the whole engine; extra configurations queue.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/11-run-orchestration.md#1-engine-component"
      resolution: "SchedulingPolicy and SuperviseRun apply configuration and per-harness slots to each run."

  - id: P9
    modules: [M01, M11]
    question: If the template is found changed during a run, should that configuration halt?
    current_assumption: The invalidation is recorded and execution continues.
    options:
      a: Keep going and record the invalidation.
      b: Halt that configuration; others continue.
      c: Halt the whole run.
    answer: c
    notes: and informe the user before it makes changes to the template of the consequence to prevent this
    application:
      status: applied
      clauses:
        - "../modules/01-template-library-identity.md#identity-and-launch-invariants"
        - "../modules/01-template-library-identity.md#library-and-revision-operations"
        - "../modules/11-run-orchestration.md#launch-boundary-and-invariants"
      refined_by: [R2-5, R3-6]
      resolution: "Detected input mutation halts the whole run; later rounds require read-only approved files and an active-run revision warning. Final retention clauses apply a run-wide invalidation to sealed facts without rewriting them."

  - id: P10
    modules: [M07, M16]
    question: Should setup and planning drafts survive an engine exit?
    current_assumption: Drafts live in memory; they survive a client disconnect but not an engine exit.
    options:
      a: Persist drafts to disk.
      b: Keep them in memory, and the engine does not idle-exit while unsaved drafts exist.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/07-run-configuration.md#conceptual-data-and-operations"
        - "../modules/16-custom-template-planning.md#baseline-and-approval-invariants"
      refined_by: [C8]
      resolution: "Setup and planning drafts persist under ~/.axbenchmark/drafts/ across engine exit; interrupted planning reopens as failed and is never silently resumed."

  - id: P11
    modules: [M06, M10]
    question: Does a partial cost measurement count as missing for ranking eligibility?
    current_assumption: Undecided; M06 reads M10's cost basis and coverage.
    options:
      a: Yes; partial excludes the entry from cost-weighted rankings.
      b: No; rank with it but label it partial.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/06-scoring-rankings.md#eligibility-and-exceptional-data"
      refined_by: [C2]
      resolution: "Partial cost excludes cost-weighted rankings while remaining visible; C2 extends the same rule to partial elapsed time when time has positive weight."

  - id: P12
    modules: [M08, M12]
    question: Which screenshots go to the judge?
    current_assumption: Undecided; boards disagree.
    options:
      a: Final-regression screenshots only (desktop and mobile).
      b: One desktop and one mobile per task.
      c: Every screenshot from every browser check.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/12-quality-judging.md#review-inputs-and-execution"
      resolution: "Only delivered-artifact final-regression screenshots at desktop and mobile viewports enter judging; per-task screenshots remain retained evidence."

  - id: P13
    modules: [M06, M13]
    question: When results in one judge group were frozen with different ranking weights, which weights does the original combined ranking use?
    current_assumption: The engine returns `scoring.original_weights_differ` and does not rank.
    options:
      a: Keep refusing; the user must pick an alternative weight set.
      b: Use the local template's saved default weights, labelled as such.
      c: Use the weights of the most recent local run in the group.
    answer: neither
    notes: "Profile defaults when originals differ: if all results froze the same weights, use them (labelled \"original\"). Otherwise, use the grading profile's SPEC §6 default weights, labelled \"Profile defaults: original weights differ across results\", so every machine shows the same ranking. Each result's own original weights stay visible in its detail and can be selected, along with custom weights, through the existing alternative-weights control. Raw grades and originals are never changed."
    application:
      status: applied
      clauses:
        - "../modules/06-scoring-rankings.md#weight-operations-and-validation"
        - "../SPEC.md#editable-weights"
      resolution: "Shared frozen weights remain original; differing originals use labelled profile defaults, with each result original still selectable as an alternative and raw records unchanged."

  - id: P14
    modules: [M04]
    question: Can a saved model-catalog override set a field back to "unknown"?
    current_assumption: No; an empty override field states nothing, so lower layers still apply.
    options:
      a: No (keep as is).
      b: Yes; add an explicit "unknown" value to overrides.
