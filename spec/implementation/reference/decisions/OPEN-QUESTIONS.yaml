        - "../modules/03-environment-readiness.md#required-readiness-behavior"
      refined_by: [R2-6, R3-4]
      resolution: "Only confirmed-usable harnesses qualify; R2-6 adds an error with consented Verify now when none qualify, and R3-4 defines CLI consent."

  - id: P16
    modules: [M01, M09]
    question: If a later release ships a new default revision (r2), does the default move to it?
    current_assumption: Undecided; r1 is never edited.
    options:
      a: Yes, the default moves to the newest built-in revision.
      b: No, the user chooses; r1 stays default until changed.
    answer: neither
    notes: new installations default to the newest revision; installations with existing results keep their current default and get a notice offering r2.
    application:
      status: applied
      clauses:
        - "../modules/01-template-library-identity.md#library-and-revision-operations"
      refined_by: [C12]
      resolution: "The user clarified in this session to keep the current SPEC: only results on the current default prevent automatic upgrade. When the current default has no results, it moves to the newest built-in revision even if other templates have results; otherwise the default is retained with an upgrade notice. This clarification supersedes the broader historical notes. R3 C12 changes only the illustrated newer revision label to r3, not the upgrade scope."

  - id: P17
    modules: [M04, M16]
    question: Should the planner preselect a default model per harness and provider?
    current_assumption: No default model; M04's catalog does not mark one.
    options:
      a: No; the user always picks.
      b: Yes; the catalog marks the harness's own default model.
    answer: b
    notes:
    application:
      status: applied
      clauses:
        - "../modules/04-model-catalog.md#catalog-information-contract"
        - "../modules/16-custom-template-planning.md#planner-selection-and-review"
      refined_by: [C3]
      resolution: "The catalog records the harness default from configuration/status without a model call; an unknown default leaves the field empty and requires an explicit model selection."

  - id: P18
    modules: [M07, M18]
    question: Should the 1-second hardware sampling interval be configurable?
    current_assumption: Fixed engine default, recorded with results.
    options:
