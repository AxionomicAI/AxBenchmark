# Application record: all original questions, explanations, suggestions, options,
# answers, notes and confirmations below are preserved history, not current policy.
# application.clauses links current SPEC/module contracts, which take precedence.
# applied means specification/design adoption; runtime remains pending. Confirmations
# marked illustration_only establish fixture text, not implemented behavior or facts.
# prototype_evidence and verification distinguish checked static examples from runtime.
# Historical D-number refers_to values are retained. decision_refs is an editorial
# mapping by topic to existing decision IDs, not a claim about the original aliases.
# Original response instructions remain below as historical context.
#
# Open questions, round 3 (last): points raised while applying rounds 1 and 2.
#
# Each item has an explanation and a suggestion. To accept the suggestion,
# write `answer: ok`. Otherwise pick an option key or write your own text,
# and add anything else under `notes`.

questions:

  - id: R3-1
    refers_to: P4, R2-1
    modules: [M04, M05, M07, M10]
    question: Where does an account's billing kind (API, subscription, local) come from?
    explanation: >
      Verified $0 requires knowing the billing is not a subscription. The spec now reads the
      billing kind from each harness's status output (no model call), and records `unknown`
      when it cannot tell; `unknown` never counts as verified $0, so such a run gets an
      API-equivalent estimate instead. Not every harness may report its login type, in which
      case its accounts would always be `unknown`.
    suggestion: >
      Keep the harness reading as the first source, and let the user declare the billing kind
      per account in the catalog (the same override mechanism as prices). A declared value is
      labelled "declared by user" wherever cost is shown. Unknown stays the default.
    options:
      a: As suggested (harness reading, plus a user declaration per account).
      b: Harness reading only; unknown when it cannot tell.
      c: User declaration only; never read from the harness.
    answer: a
    notes:
    application:
      status: applied
      decision_refs: [P4, R2-1]
      clauses:
        - "../modules/04-model-catalog.md#catalog-information-contract"
        - "../modules/07-run-configuration.md#configuration-behavior"
        - "../modules/10-measurements-cost.md#cost-basis-and-currency"
      resolution: "Billing resolves per account: user declaration, then harness status without a model call (or local endpoint), then unknown. The frozen value retains provenance and declared-by-user labels. F16 separates account billing from model overrides. Unknown billing cannot verify zero; positive amounts remain usable with the limitation, and zero estimates remain unverified under F08."
      verification: {specification: adopted, runtime: pending}

  - id: R3-2
    refers_to: D4
    modules: [M04, M07, M10]
    question: How should provider prices in currencies other than USD be handled?
    explanation: >
      Costs are shown in USD. A provider price in USD is used as is; a COP price is converted
      with the run's recorded COP rate. Any other currency (e.g. EUR, CNY) currently makes the
      estimate unknown, because SPEC only provides for a COP rate. Some providers publish
      prices in other currencies.
    suggestion: >
      Generalise the recorded COP rate to "recorded exchange rates": the run configuration can
      hold rates to USD for any currency, frozen at launch and shown with every converted
      estimate. Without a rate for a price's currency, the estimate stays unknown. COP display
      keeps working as today.
    options:
      a: As suggested (any currency with a recorded rate).
      b: Keep USD and COP only; other currencies give an unknown estimate.
    answer: lets add a tool for converting currencies. and convert it to the desired currency.
    notes:
    application:
      status: applied
      decision_refs: [P4, R2-2]
      clauses:
        - "../SPEC.md#4-models-and-configuration"
        - "../modules/04-model-catalog.md#catalog-information-contract"
        - "../modules/07-run-configuration.md#configuration-behavior"
        - "../modules/10-measurements-cost.md#cost-basis-and-currency"
      resolution: "The final conversion tool uses catalog-collected or user-supplied rates frozen at launch for price, tariff and display currencies. Rates mean currency units per USD (COP 4000); conversion is price currency to USD to the chosen display currency. Missing rates leave conversions unknown. Historical USD-only/COP-only and configuration-held-rate assumptions are superseded: display currency is chosen before launch and cannot change in later analysis; mixed-currency comparisons use USD with a notice."
      verification: {specification: adopted, runtime: pending}

  - id: R3-3
    refers_to: D1
    modules: [M11, M13, M14]
    question: Should `run --no-tui` wait for the HTML report before exiting?
    explanation: >
      After a run completes, the engine generates the report. The CLI now waits for it, prints
      its path, and exits 0. If report generation fails, it prints the error and still exits 0,
      because the run itself completed. Waiting can add time after long runs; not waiting means
      a script may exit before the report exists.
    suggestion: >
      Wait by default and print the path. Add `--no-wait-report` for scripts that only need the
      run. A failed report prints the error and exits 0; `axbenchmark report RUN_DIR` regenerates it.
    options:
      a: As suggested.
      b: Wait, with no option to skip.
      c: Never wait; print the command to generate or open the report.
      d: Wait, and exit 1 when report generation fails.
    answer: a
    notes:
    application:
      status: applied
      decision_refs: [P1, C1]
      clauses:
        - "../modules/14-command-line-interface.md#unattended-execution-and-lifecycle"
      resolution: "The unattended CLI waits for durable completion-report disposition by default and prints the path or failure/retry guidance. --no-wait-report exits after the terminal run outcome while the engine still schedules reporting. Completed runs exit 0 despite report failure; stopped/interrupted runs and typed retention-pending failures keep their separate exit-1 behavior."
      verification: {specification: adopted, runtime: pending}

  - id: R3-4
    refers_to: D15
    modules: [M03, M14]
    question: How does `axbenchmark doctor --verify` ask for consent?
    explanation: >
      "Verify now" makes one minimal model call per harness, which may cost a little, so it needs
      consent. In the TUI that is a confirmation dialog. The CLI wireframe shows a `[y/N]` prompt,
      but unattended scripts cannot answer prompts.
    suggestion: >
      Interactive terminals get a `[y/N]` prompt listing the harnesses and that each makes one
      minimal call. `--yes` gives consent without a prompt. Without a terminal and without
      `--yes`, the command exits 2 with a message naming `--yes`.
    options:
      a: As suggested.
      b: Always require `--yes`; no prompt.
    answer: a
    notes:
    application:
      status: applied
      decision_refs: [P15, R2-6]
      clauses:
        - "../modules/03-environment-readiness.md#required-readiness-behavior"
        - "../modules/14-command-line-interface.md#1-engine-component"
        - "../modules/14-command-line-interface.md#5-cli"
      resolution: "Interactive doctor --verify shows the engine verification plan (harnesses, versions, one minimal call each and possible usage) and asks [y/N], default No. Decline, empty input or EOF makes no call. --yes supplies explicit consent without prompting; nonterminal use without --yes exits 2 before connection and names --yes."
      verification: {specification: adopted, runtime: pending}

  - id: R3-5
    refers_to: D4
    modules: [M04]
    question: Which providers get a price source in the first version?
    explanation: >
      The price table collects each provider's published prices during a catalog refresh, with one
      adapter per provider. Each adapter depends on that provider's pricing page or API and needs
      maintenance when it changes. Bundled prices are the fallback when a source fails.
    suggestion: >
      Ship adapters for the providers behind the four supported harnesses (Anthropic, OpenAI, xAI)
      and for OpenRouter-style aggregators only if a harness uses them; everything else relies on
      bundled prices and user overrides. A failing adapter keeps the last valid prices and says so.
    options:
      a: As suggested.
      b: No collection in the first version; bundled prices and overrides only.
      c: List the providers in notes.
    answer: a
    notes:
    application:
      status: applied
      decision_refs: [P4, R2-1]
      clauses:
        - "../modules/04-model-catalog.md#catalog-information-contract"
      resolution: "The first-version specification requires Anthropic, OpenAI and xAI price sources, plus an aggregator only when a supported harness uses it. Other providers rely on bundled prices/overrides and report no source. Refresh failure keeps last-valid prices with cause and age visible; launch freezes provenance. This adoption does not certify live provider adapters."
      verification: {specification: adopted, runtime: pending}

  - id: R3-6
    refers_to: D9
    modules: [M01]
    question: Is making approved revision files read-only on disk acceptable?
    explanation: >
      To prevent accidental edits during a run, approved revision files are written read-only
      (files 0444, folders 0555) under ~/.axbenchmark/. Tools that clean or sync the home
      directory may need write access to delete them, and a user editing them by hand gets a
      permission error, which is intended.
    suggestion: >
      Keep read-only. Deleting a template goes through the app, which restores write permission
      only for removal. `doctor` reports revision folders whose permissions were changed.
    options:
      a: As suggested.
      b: Leave files writable; rely on the identity check and the halt.
    answer: a
    notes:
    application:
      status: applied
      decision_refs: [P9, R2-5]
      clauses:
        - "../modules/01-template-library-identity.md#identity-and-launch-invariants"
        - "../modules/01-template-library-identity.md#1-engine-component"
        - "../modules/03-environment-readiness.md#required-readiness-behavior"
      resolution: "Approved storage uses files 0444/directories 0555. App deletion or restore retires the old tree and makes only its directories writable for removal after read leases drain; files and other revisions keep their modes. Doctor reports mode drift and the app-restore remedy without changing permissions. Executable intent is separately hashed and restored in working copies; mode drift alone does not alter identity."
      verification: {specification: adopted, runtime: pending}

  - id: R3-7
    refers_to: D7
    modules: [M07, M11, M12]
    question: Is there an upper limit on trials per configuration?
    explanation: >
      Each trial reruns every task from a fresh baseline and is judged separately, so cost and
      time scale with the number of trials. With 4 configurations, 7 tasks and up to 3 hours per
      task, a high trial count can mean days of execution and many judge sessions.
    suggestion: >
      Allow 1–10 trials. Setup and the launch review show the total task and judge-session counts
      before launch (e.g. "4 configurations × 3 trials × 7 tasks = 84 task runs, 12 judge sessions").
    options:
      a: As suggested (1–10, with totals shown).
      b: No upper limit, totals shown.
      c: Another limit (write it in notes).
    answer: b
    notes: but after 5 runs inform the user clearly with a dialog that more 5 runs will drain the budget and subscription. if is local gpu do not ask the user.
    application:
      status: applied
      decision_refs: [P7, R2-4]
      clauses:
        - "../SPEC.md#verification-and-evidence"
        - "../modules/07-run-configuration.md#configuration-behavior"
        - "../modules/07-run-configuration.md#4-screens"
        - "../modules/14-command-line-interface.md#unattended-execution-and-lifecycle"
      resolution: "Any positive whole trial count is accepted; the suggested 1-10 limit is superseded. Setup/review show task-run and judge-session totals. More than five trials with any non-local competitor produces a pre-launch budget/subscription warning and TUI confirmation; all-local competitors suppress it regardless of the independent judge. Unattended execution prints the final warning/totals once and continues without prompting."
      verification: {specification: adopted, runtime: pending}

