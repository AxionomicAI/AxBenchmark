# Application record: all original questions, explanations, suggestions, options,
# answers and notes below are preserved history, not current policy.
# application.clauses links the current normative SPEC/module clauses; they take
# precedence over historical wording. applied means incorporated into specification
# and design contracts, not implemented or runtime-verified functionality.
# refined_by identifies later decisions in OPEN-QUESTIONS-R3.yaml; resolution records
# their refinements and any superseded suggestion. Original response instructions
# remain below as historical context.
#
# Open questions, round 2: follow-ups to the answers in OPEN-QUESTIONS.yaml.
#
# Each item has an explanation and a suggestion. To accept the suggestion,
# write `answer: ok`. Otherwise pick an option key or write your own text,
# and add anything else under `notes`.

follow_ups:

  - id: R2-1
    refers_to: P4
    question: Does a reported $0 count as verified when the billing is a subscription?
    explanation: >
      You said cost is verified $0 when the API says so. Some harnesses report $0 (or omit cost)
      when usage is covered by a subscription plan. SPEC §5 says "A subscription or missing price
      is not a zero-cost run", so a subscription $0 must not win the lowest-cost ranking.
    suggestion: >
      Verified $0 only when the provider or harness reports $0, usage coverage is complete for
      every task, and the billing basis is not a subscription. Otherwise the cost is unknown or an
      estimate, never zero.
    options:
      a: As suggested.
      b: Any reported $0 counts, including subscriptions (contradicts SPEC §5; needs a SPEC change).
    answer: we need to create something to scrape the prices from each provider so we could have a table to compute this in case the harness does not provide the price
    notes:
    application:
      status: applied
      clauses:
        - "../modules/04-model-catalog.md#catalog-information-contract"
        - "../modules/10-measurements-cost.md#cost-basis-and-currency"
        - "../modules/06-scoring-rankings.md#eligibility-and-exceptional-data"
      refined_by: [R3-1, R3-5]
      resolution: "The answer adds collected provider prices, frozen at launch, for API-equivalent estimates. R3-5 fixes provider-source coverage and R3-1 adds account billing declarations. The unaccepted 'never zero' suggestion is not current policy: F08 retains numeric zero estimates as unverified and excludes them from lowest-cost and positive-cost-weight rankings."

  - id: R2-2
    refers_to: P4
    question: How does the user give the electricity price for local models?
    explanation: >
      You said that for local models with measurable GPU power, the app shows kWh and asks the user
      for the cost. Unattended runs (`run --no-tui`) cannot stop to ask, and SPEC §7 already allows
      an optional electricity tariff.
    suggestion: >
      An optional tariff ($/kWh, with currency) in the run configuration, set in Setup or YAML before
      launch and frozen with the run. It can also be entered or changed afterwards in Results as an
      analysis setting, which recalculates the energy-cost estimate without changing the original
      record.
    options:
      a: As suggested (before launch, and editable later as analysis).
      b: Before launch only.
      c: In Results only, after the run.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/07-run-configuration.md#configuration-behavior"
        - "../modules/10-measurements-cost.md#cost-basis-and-currency"
      refined_by: [R3-2]
      resolution: "An optional tariff with currency is set in Setup/YAML and frozen at launch; Results can apply an alternative tariff without changing the record. R3-2 adds collected or supplied exchange rates frozen at launch; an alternative tariff without its required frozen rate remains unknown."

  - id: R2-3
    refers_to: P4
    question: Does a local model's energy-cost estimate count as its cost in rankings?
    explanation: >
      With your P4 and P11 answers, a local model has no API cost, so its cost is unknown and it
      drops out of the lowest-cost ranking and of combined rankings with a cost weight above 0.
      Comparing local rigs against cloud models is a core use of this benchmark, so this matters.
      SPEC §7 currently keeps energy cost separate from rankings, for two reasons: GPU or CPU-package
      readings are not whole-system electricity, and in parallel runs shared GPU energy cannot be
      divided between configurations.
    suggestion: >
      Option b. In sequential runs, where each configuration's execution windows are known, the
      energy-cost estimate (measured kWh × tariff) counts as that configuration's cost. It is labelled
      "energy estimate · GPU+CPU package · not whole-system", and the ranking shows its basis next to
      API costs. In parallel runs it stays separate and the cost is unknown. This needs a small
      SPEC §7 change, which I would make.
    options:
      a: Keep it separate; local models show kWh and an energy estimate but have no cost ranking.
      b: As suggested (sequential runs only, labelled estimate, SPEC §7 updated).
      c: Count it in parallel runs too, with an equal split of shared energy (contradicts SPEC §7).
    answer: b
    notes:
    application:
      status: applied
      clauses:
        - "../modules/10-measurements-cost.md#cost-basis-and-currency"
        - "../modules/06-scoring-rankings.md#eligibility-and-exceptional-data"
      resolution: "Sequential local configurations may rank on measured execution-window energy times tariff, labelled with scope; parallel shared energy is not allocated. Missing or partial inputs retain their eligibility limits, and current F08 excludes unverified zero estimates from cost-dependent rankings."

  - id: R2-4
    refers_to: P7
    question: How are multiple trials aggregated and judged?
    explanation: >
      You want each trial's results visible plus an average. The details decide cost and fairness:
      every trial produces its own artifact, so judging each one multiplies judging cost by N, and
      eligibility has to say what happens when some trials pass and others fail.
    suggestion: >
      Trials of a configuration run one after another, each from a fresh baseline. Each trial is
      judged separately (N judge sessions). Results show every trial plus the mean of cost, time and
      quality, with the min–max range. Rankings use the means. A configuration is eligible only when
      every trial is eligible, so a flaky configuration cannot rank on its good trials alone.
    options:
      a: As suggested.
      b: Same, but eligibility uses the mean of the eligible trials only.
      c: Same, but only the last trial is judged.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/11-run-orchestration.md#scheduling-contract"
        - "../modules/12-quality-judging.md#review-inputs-and-execution"
        - "../modules/06-scoring-rankings.md#calculations"
        - "../modules/07-run-configuration.md#configuration-behavior"
      refined_by: [R3-7]
      resolution: "Each trial starts from a fresh baseline, runs sequentially within its configuration and receives a separate judge session. Rankings use means, show min-max and require every expected trial to qualify. R3-7 adds no upper limit and the more-than-five-trials warning for non-local competitors."

  - id: R2-5
    refers_to: P9
    question: How should the app prevent and warn about template changes during a run?
    explanation: >
      You asked to inform the user before changes are made to the template. The app itself never
      edits an approved revision: duplicate and revise always create a new one. A change during a
      run can only come from outside the app, such as a manual edit or a script on the revision files.
    suggestion: >
      Two measures. First, approved revision files are written read-only on disk, so accidental edits
      fail. Second, choosing duplicate or revise on a revision with an active run shows: "This
      creates a new revision. The active run continues on r1, and its results will not be comparable
      with the new revision." If an outside change is still detected, the whole run halts (your P9
      answer).
    options:
      a: As suggested.
      b: Only the warning; do not make files read-only.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/01-template-library-identity.md#library-and-revision-operations"
        - "../modules/01-template-library-identity.md#identity-and-launch-invariants"
        - "../modules/11-run-orchestration.md#launch-boundary-and-invariants"
      refined_by: [R3-6]
      resolution: "Approved files are read-only; duplicate/revise warns before editing when the revision has an active run. Detected mutation halts and invalidates the whole run while retaining evidence. R3-6 adds app-managed removal and doctor mode-drift reporting; current deletion rules make only retired directories writable."

  - id: R2-6
    refers_to: P15
    question: What happens when no harness is confirmed usable for planning?
    explanation: >
      You chose to prefer a confirmed-usable harness and show an error if none is found. Some
      harnesses cannot confirm login without a paid model call, so on a fresh install they stay
      "undetermined" until they have run once. Your rule would then block planning on a fresh install.
    suggestion: >
      The error offers a "Verify now" action. With the user's consent it makes one minimal headless
      call per harness to confirm login and headless operation, records the outcome, and then
      preselects the first usable harness. Nothing is preselected or run without that confirmation.
    options:
      a: As suggested.
      b: Allow picking an undetermined harness by hand; only the preselection refuses it.
      c: Block until the harness becomes usable some other way.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/16-custom-template-planning.md#planner-selection-and-review"
        - "../modules/03-environment-readiness.md#required-readiness-behavior"
      refined_by: [R3-4]
      resolution: "No confirmed-usable planner yields an error with Verify now; explicit consent authorizes one minimal call per harness, with recorded outcomes before preselection. R3-4 adds CLI prompt/--yes consent and exit 2 for a noninteractive invocation without --yes."

  - id: R2-7
    refers_to: P2
    question: Which Library key opens the inventory "about" screens?
    explanation: >
      `?` stays Help (your P2 answer). `i` is already Import on the Library; `a` is free.
    suggestion: "`a` (about), shown in the Footer when the selected row is the built-in inventory template."
    options:
      a: As suggested.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/01-template-library-identity.md#4-screens"
        - "../modules/09-default-inventory-benchmark.md#3-requires-from-other-modules"
      resolution: "Library a opens InventoryAboutScreen and is shown in the Footer for built-in inventory rows; ? remains app-wide Help."

  - id: R2-8
    refers_to: W9
    question: Add a dialog for editing a service row on the Setup/start/stop tab?
    explanation: >
      You answered the name-field half of W9. The other half is unanswered. A template's
      Setup/start/stop tab lists the commands that install, start and stop the generated app.
      The spec lets `e` edit one and the engine supports it, but no dialog is drawn.
    suggestion: >
      A modal with command, working directory, port and readiness check, styled like the
      task editor, with validation errors shown per field.
    options:
      a: As suggested.
      b: No; service rows can only be changed by regenerating the plan.
    answer: a
    notes:
    application:
      status: applied
      clauses:
        - "../modules/16-custom-template-planning.md#planner-selection-and-review"
        - "../modules/16-custom-template-planning.md#4-screens"
      resolution: "ServiceEditScreen/PlanServiceEdit is the modal for command, working directory, port and readiness check, styled like the task editor and showing field-specific validation errors."

