  - id: C1
    refers_to: P1
    item: >
      A completed run exits 0 even with failed tasks. Scripts detect task failures by reading
      `axbenchmark status RUN_ID --json`.
    answer: ok
    application:
      status: applied
      clauses:
        - "../modules/14-command-line-interface.md#unattended-execution-and-lifecycle"
      refined_by: [R3-3]
      resolution: "Completed runs exit 0 despite task failures; scripts inspect status --json. R3-3 adds default report waiting and --no-wait-report, while a failed completion report still leaves a completed run's exit code at 0."

  - id: C2
    refers_to: P11
    item: >
      The "partial counts as missing" rule also applies to elapsed time: a partial time excludes the
      entry from rankings where time has positive weight.
    answer: ok
    application:
      status: applied
      clauses:
        - "../modules/06-scoring-rankings.md#eligibility-and-exceptional-data"
      resolution: "Partial elapsed time counts as missing for rankings requiring time, including combined rankings with positive time weight; the partial value and coverage remain visible."

