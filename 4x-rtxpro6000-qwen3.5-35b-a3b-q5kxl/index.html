<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Inventory Management</h1>
        </header>

        <main>
            <section class="form-section">
                <h2 id="form-title">Add New Item</h2>
                <form id="item-form">
                    <div class="form-group">
                        <label for="item-name">Item Name:</label>
                        <input type="text" id="item-name" required>
                    </div>
                    <div class="form-group">
                        <label for="item-quantity">Quantity:</label>
                        <input type="number" id="item-quantity" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="item-price">Price ($):</label>
                        <input type="number" id="item-price" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="item-category">Category:</label>
                        <input type="text" id="item-category" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="submit-btn">Add Item</button>
                        <button type="button" id="cancel-btn" class="btn-cancel" style="display: none;">Cancel</button>
                    </div>
                </form>
            </section>

            <section class="items-section">
                <h2>Inventory Items</h2>
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search by name, category, or quantity...">
                    <button type="button" id="clear-search" class="btn-clear" style="display: none;">Clear</button>
                </div>
                <table id="inventory-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Category</th>
                            <th>Total Value</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body">
                        <!-- Items will be inserted here -->
                    </tbody>
                </table>
            </section>

            <section class="cart-section">
                <h2>Shopping Cart</h2>
                <div id="cart-controls">
                    <button type="button" id="add-all-to-cart" class="btn-add-all">Add All Items to Cart</button>
                    <button type="button" id="clear-cart" class="btn-clear-cart" style="display: none;">Clear Cart</button>
                    <button type="button" id="checkout-btn" class="btn-checkout" style="display: none;">Checkout</button>
                </div>
                <table id="cart-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="cart-body">
                        <!-- Cart items will be inserted here -->
                    </tbody>
                </table>
                <div id="cart-summary" style="display: none; margin-top: 15px; text-align: right;">
                    <h3>Total: <span id="cart-total">$0.00</span></h3>
                </div>
            </section>

            <section class="orders-section">
                <h2>Order History</h2>
                <div id="orders-controls">
                    <button type="button" id="view-all-orders" class="btn-view-orders">View All Orders</button>
                    <button type="button" id="clear-orders" class="btn-clear-orders" style="display: none;">Clear History</button>
                </div>
                <div id="orders-list" style="display: none;">
                    <table id="orders-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-body">
                            <!-- Orders will be inserted here -->
                        </tbody>
                    </table>
                </div>
                <div id="no-orders-message" class="empty-message">
                    No orders yet. Complete a purchase to see it here.
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
